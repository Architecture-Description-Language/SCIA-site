<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>SCIA chip medallion</title>
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2c27a"/>
      <stop offset="0.45" stop-color="#b48c3c"/>
      <stop offset="1" stop-color="#6e5115"/>
    </linearGradient>
    <linearGradient id="brassEdge" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3e2d0c"/>
      <stop offset="1" stop-color="#8a6720"/>
    </linearGradient>
    <radialGradient id="field" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#1f2a3a"/>
      <stop offset="1" stop-color="#0d121a"/>
    </radialGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d9be0"/>
      <stop offset="0.5" stop-color="#3a63a3"/>
      <stop offset="1" stop-color="#22406e"/>
    </linearGradient>
  </defs>
  <!-- ring -->
  <circle cx="256" cy="256" r="250" fill="url(#brassEdge)"/>
  <circle cx="256" cy="256" r="238" fill="url(#brass)"/>
  <circle cx="256" cy="256" r="192" fill="url(#brassEdge)"/>
  <circle cx="256" cy="256" r="184" fill="url(#field)"/>
  <!-- pins -->
  <g fill="url(#brass)" stroke="#2a1f08" stroke-width="2">
    <rect x="205.0" y="138.0" width="14" height="40" rx="3"/>
    <rect x="205.0" y="334.0" width="14" height="40" rx="3"/>
    <rect x="138.0" y="205.0" width="40" height="14" rx="3"/>
    <rect x="334.0" y="205.0" width="40" height="14" rx="3"/>
    <rect x="249.0" y="138.0" width="14" height="40" rx="3"/>
    <rect x="249.0" y="334.0" width="14" height="40" rx="3"/>
    <rect x="138.0" y="249.0" width="40" height="14" rx="3"/>
    <rect x="334.0" y="249.0" width="40" height="14" rx="3"/>
    <rect x="293.0" y="138.0" width="14" height="40" rx="3"/>
    <rect x="293.0" y="334.0" width="14" height="40" rx="3"/>
    <rect x="138.0" y="293.0" width="40" height="14" rx="3"/>
    <rect x="334.0" y="293.0" width="40" height="14" rx="3"/>
  </g>
  <!-- chip -->
  <rect x="172" y="172" width="168" height="168" rx="16" fill="url(#brass)" stroke="#2a1f08" stroke-width="3"/>
  <rect x="190" y="190" width="132" height="132" rx="10" fill="#0e1520"/>
  <rect x="200" y="200" width="112" height="112" rx="8" fill="url(#chip)"/>
  <rect x="210" y="210" width="92" height="46" rx="6" fill="#ffffff" opacity="0.10"/>
</svg>
